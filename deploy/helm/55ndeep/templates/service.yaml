apiVersion: v1
kind: Service
metadata:
  name: {{ include "55ndeep.fullname" . }}
  labels:
    {{- include "55ndeep.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: health
  selector:
    {{- include "55ndeep.selectorLabels" . | nindent 4 }}
