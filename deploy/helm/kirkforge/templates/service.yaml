apiVersion: v1
kind: Service
metadata:
  name: {{ include "kirkforge.fullname" . }}
  labels:
    {{- include "kirkforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: health
  selector:
    {{- include "kirkforge.selectorLabels" . | nindent 4 }}
