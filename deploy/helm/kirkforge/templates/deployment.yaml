apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kirkforge.fullname" . }}
  labels:
    {{- include "kirkforge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kirkforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kirkforge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kirkforge.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ .Values.healthServer.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            {{- if .Values.enterprise.enabled }}
            - name: 55NDEEP_ENTERPRISE_MODE
              value: "1"
            - name: MEMORY_BACKEND
              value: {{ .Values.enterprise.memoryBackend | quote }}
            - name: AUDIT_SINK_TYPE
              value: {{ .Values.enterprise.audit.sinkType | quote }}
            {{- if .Values.enterprise.audit.filePath }}
            - name: AUDIT_FILE_PATH
              value: {{ .Values.enterprise.audit.filePath | quote }}
            {{- end }}
            {{- if .Values.enterprise.audit.httpUrl }}
            - name: AUDIT_HTTP_URL
              value: {{ .Values.enterprise.audit.httpUrl | quote }}
            {{- end }}
            {{- if .Values.enterprise.policy.filePath }}
            - name: POLICY_FILE_PATH
              value: {{ .Values.enterprise.policy.filePath | quote }}
            {{- end }}
            {{- if .Values.enterprise.policy.serviceUrl }}
            - name: POLICY_SERVICE_URL
              value: {{ .Values.enterprise.policy.serviceUrl | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.enterprise.enabled }}
            {{- if or .Values.enterprise.oidc.issuer .Values.auth.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ (coalesce .Values.enterprise.oidc.issuer .Values.auth.oidc.issuer) | quote }}
            - name: OIDC_AUDIENCE
              value: {{ (coalesce .Values.enterprise.oidc.audience .Values.auth.oidc.audience) | quote }}
            {{- end }}
            {{- if or .Values.enterprise.oidc.groupRoleMap .Values.auth.oidc.groupRoleMap }}
            - name: OIDC_GROUP_ROLE_MAP
              value: {{ (coalesce .Values.enterprise.oidc.groupRoleMap .Values.auth.oidc.groupRoleMap) | quote }}
            {{- end }}
            {{- if and .Values.enterprise.audit.sinkType (eq .Values.enterprise.audit.sinkType "http") .Values.enterprise.audit.httpHeaders }}
            {{- range $key, $value := .Values.enterprise.audit.httpHeaders }}
            - name: AUDIT_HTTP_HEADER_{{ $key | upper | replace "-" "_" }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.otlpEndpoint | quote }}
            {{- end }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.model.ollama.baseUrl | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configmapRef:
                name: {{ include "kirkforge.fullname" . }}-config
            - secretRef:
                name: {{ include "kirkforge.fullname" . }}-secret
          {{- if .Values.observability.health.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.observability.health.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.observability.health.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.observability.health.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.enterprise.enabled }}
            {{- if and .Values.enterprise.audit.sinkType (eq .Values.enterprise.audit.sinkType "file") }}
            - name: audit
              mountPath: /var/lib/kirkforge/audit
            {{- end }}
            {{- end }}
            - name: memory
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.enterprise.enabled }}
        {{- if and .Values.enterprise.audit.sinkType (eq .Values.enterprise.audit.sinkType "file") }}
        - name: audit
          emptyDir: {}
        {{- end }}
        {{- end }}
        - name: memory
          persistentVolumeClaim:
            claimName: {{ include "kirkforge.fullname" . }}-memory
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
