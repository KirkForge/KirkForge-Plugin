name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.sandbox"
      - "docker-compose.yml"
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"

permissions:
  packages: write
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-daemon:
    name: Publish daemon image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kirkforge/kirkforge:latest
            ghcr.io/kirkforge/kirkforge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-sandbox:
    name: Publish sandbox image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          push: true
          tags: |
            ghcr.io/kirkforge/kirkforge-sandbox:latest
            ghcr.io/kirkforge/kirkforge-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
