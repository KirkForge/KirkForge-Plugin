name: Release

on:
  push:
    branches: [master]
    paths:
      - 'packages/plugin/**'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Verify CI gate
        run: npm run ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Generate SBOM for release
        run: npx cyclonedx-npm --output-file sbom.json --omit dev

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: release-sbom
          path: sbom.json
          retention-days: 90
