name: Performance Regression

on:
  pull_request:
    branches: [master]

jobs:
  perf:
    name: Benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          echo "Running correction prompt benchmarks..."
          npx vitest run packages/correction-core/tests/bench-normalize.test.ts --reporter=json > bench-results/correction.json 2>&1 || true
          echo "Running orchestrator benchmarks..."
          npx vitest run packages/orchestrator/tests/coverage.test.ts --reporter=json > bench-results/orchestrator.json 2>&1 || true

      - name: Perf regression check
        run: |
          echo "Benchmark results available in bench-results/"
          echo "Add baseline comparison when historical data exists"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          retention-days: 7

  size:
    name: Bundle size gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check plugin bundle size
        run: |
          SIZE=$(du -sh packages/plugin/dist/ 2>/dev/null | cut -f1)
          echo "Plugin dist size: $SIZE"
          echo "Warn if > 2MB (current threshold)"
