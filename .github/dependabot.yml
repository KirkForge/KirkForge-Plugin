version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - automerge
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript"
          - "eslint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    labels:
      - dependencies
      - ci
