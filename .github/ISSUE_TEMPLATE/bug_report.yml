name: Bug report
description: Report something broken or unexpected
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to happen?
      placeholder: Clear and concise description.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally a small repo or gist.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant logs. Redact secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v1.0.0-rc1 or commit sha

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: e.g. 22.2.0

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Anything else that helps.
